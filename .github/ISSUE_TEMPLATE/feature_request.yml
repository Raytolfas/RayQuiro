name: Feature Request
description: Propose a language feature, built-in module, or toolchain improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Subsystem
      options:
        - Language Syntax / Type System
        - Bytecode VM / Runtime
        - Native Compiler (TinyCC / LLVM)
        - Standard Library / FFI / Buffers
        - Engine / UI / Web
        - CLI / Package Manager / LSP
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal & Example Syntax
      description: Describe the feature and show how it would look in .rq code
      render: rq
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: What problem does this solve?
    validations:
      required: true
