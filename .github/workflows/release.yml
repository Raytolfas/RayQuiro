name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0, leave empty to only build artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Raylib if not present
        shell: bash
        run: |
          if [ ! -d "third_party/raylib/src" ]; then
            mkdir -p third_party
            git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party/raylib
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev

      - name: Build and verify (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tr -d '\r' < build.sh > build_unix.sh
          mv build_unix.sh build.sh
          chmod +x ./build.sh
          bash ./build.sh
          ./rqio test

      - name: Build and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1
          ./rqio.exe test

      - name: Prepare binaries (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          mkdir -p out
          cp rqio out/rqio
          cp rqio_core.so out/rqio_core.so

      - name: Prepare binaries (macOS)
        if: matrix.target == 'macos-arm64'
        run: |
          mkdir -p out
          cp rqio out/rqio-macos
          cp rqio_core.dylib out/rqio_core.dylib

      - name: Prepare binaries (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item rqio.exe out/rqio.exe
          Copy-Item rqio_core.dll out/rqio_core.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true
