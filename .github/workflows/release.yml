name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0, leave empty to only build artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            archive: rqio-linux-x64.tar.gz
          - target: windows-x64
            os: windows-latest
            archive: rqio-windows-x64.zip
          - target: macos-arm64
            os: macos-latest
            archive: rqio-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Raylib if not present
        shell: bash
        run: |
          if [ ! -d "third_party/raylib/src" ]; then
            mkdir -p third_party
            git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git third_party/raylib
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev

      - name: Build and verify (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./build.sh
          ./build.sh
          ./rqio test

      - name: Build and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1
          ./rqio.exe test

      - name: Package archive (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          tar -czf ${{ matrix.archive }} rqio rqio_core.so LICENSE README.md

      - name: Package archive (macOS)
        if: matrix.target == 'macos-arm64'
        run: |
          tar -czf ${{ matrix.archive }} rqio rqio_core.dylib LICENSE README.md

      - name: Package archive (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $items = @("rqio.exe", "rqio_core.dll", "LICENSE", "README.md")
          if (Test-Path "third_party/tcc") { $items += "third_party/tcc" }
          Compress-Archive -Path $items -DestinationPath ${{ matrix.archive }} -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true
